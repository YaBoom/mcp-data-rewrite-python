[project]
name = "mcp-data-rewrite-python"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "YaBoom", email = "15007105273@163.com" }
]
requires-python = ">=3.13"
dependencies = [
    "asyncmy>=0.2.17",
    "httpx>=0.28.1",
    "mcp>=2.3.0",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.1",
    "redis>=8.1.0",
]

[project.scripts]
mcp-data-rewrite-python = "mcp_data_rewrite_python.__main__:main"

[build-system]
requires = ["uv_build>=0.9.11,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.1",
    "ruff>=0.17.2",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["src"]
